apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: twitter-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: twitter-clone-config
            - secretRef:
                name: twitter-clone-secret
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: twitter-clone
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
