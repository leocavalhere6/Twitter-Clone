apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: twitter-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          envFrom:
            - configMapRef:
                name: twitter-clone-config
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: twitter-clone
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
