apiVersion: v1
kind: ConfigMap
metadata:
  name: twitter-clone-config
  namespace: twitter-clone
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: local_db
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MONGO_INITDB_DATABASE: twitter_clone
  MONGODB_URI: mongodb://mongodb:27017/twitter_clone
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
---
apiVersion: v1
kind: Secret
metadata:
  name: twitter-clone-secret
  namespace: twitter-clone
type: Opaque
stringData:
  POSTGRES_USER: local_user
  POSTGRES_PASSWORD: local_password
  DATABASE_URL: postgres://local_user:local_password@postgres:5432/local_db
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
